<title>Backtest Reality Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
html,body{margin:0}
footer a{color:var(--accent)}
:root{
  --ground:#F3F5F4; --surface:#FFFFFF; --ink:#17212B; --muted:#5A6670; --rule:#D8DEDC; --soft:#E9EDEC;
  --bh:#2B6CB0; --bh-soft:#DCE8F6; --good:#2F7D4F; --good-soft:#DDEFE3; --bad:#C2413B; --bad-soft:#F8DEDB;
  --flag:#A8620A; --flag-soft:#F6E7CF; --accent:#1F3A5F;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#10161C; --surface:#172029; --ink:#E6ECEF; --muted:#9AA7B1; --rule:#2B3742; --soft:#1E2933;
    --bh:#6FA8E8; --bh-soft:#1D3350; --good:#5DBB84; --good-soft:#193528; --bad:#EE7F77; --bad-soft:#3F2220;
    --flag:#E0A04A; --flag-soft:#3A2B15; --accent:#9DB7DA;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#10161C; --surface:#172029; --ink:#E6ECEF; --muted:#9AA7B1; --rule:#2B3742; --soft:#1E2933;
  --bh:#6FA8E8; --bh-soft:#1D3350; --good:#5DBB84; --good-soft:#193528; --bad:#EE7F77; --bad-soft:#3F2220;
  --flag:#E0A04A; --flag-soft:#3A2B15; --accent:#9DB7DA;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:-.01em}
h2{font-size:26px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{display:grid;gap:14px;padding-bottom:22px;border-bottom:2px solid var(--ink)}
header.top .lede{font-size:17px;color:var(--muted)}
.studies{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:6px}
.study{border-left:3px solid var(--accent);padding:4px 0 4px 12px;display:grid;gap:2px}
.study b{font-weight:600}
.study span{color:var(--muted);font-size:13px}
nav.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--rule);
  display:flex;gap:4px 18px;flex-wrap:wrap;padding:10px 0;margin-bottom:8px}
nav.jump a{color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;padding:2px 0;border-bottom:2px solid transparent}
nav.jump a:hover,nav.jump a:focus-visible{border-bottom-color:var(--accent);outline:none}
section{padding-top:40px;display:grid;gap:16px}
.sec-head{display:grid;gap:6px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
/* ledger */
.ledger{display:grid;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:110px 1fr 150px 150px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.row .claim{font-size:14.5px}
.row .claim small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.fig{display:grid;gap:0}
.fig .v{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.fig .l{font-size:12px;color:var(--muted);line-height:1.3}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.dxy{background:var(--bh-soft);color:var(--bh)}
.tag.com{background:var(--flag-soft);color:var(--flag)}
@media (max-width:720px){
  .row{grid-template-columns:1fr 1fr}
  .row .claim{grid-column:1/-1}
  .row .tagcell{grid-column:1/-1}
}
/* controls */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{font:500 13px var(--body);color:var(--ink);background:transparent;border:0;padding:7px 14px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.controls label{font-size:13px;color:var(--muted)}
.chart{position:relative;height:340px}
.chart.tall{height:380px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 12px var(--body);text-align:left;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--rule);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.bh{background:var(--bh-soft)}
td.up{background:var(--good-soft)}
td.dn{background:var(--bad-soft)}
.chip{display:inline-block;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.chip.pass{background:var(--good-soft);color:var(--good)}
.chip.fail{background:var(--bad-soft);color:var(--bad)}
.chip.close{background:var(--flag-soft);color:var(--flag)}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:3px solid var(--flag);padding:10px 14px;background:var(--flag-soft);border-radius:0 4px 4px 0;font-size:14px;max-width:none}
/* business */
.uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.use{display:grid;gap:8px;align-content:start}
.use .q{font-family:var(--display);font-weight:600;font-size:17px}
.use ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.kpi{background:var(--surface);padding:14px;display:grid;gap:4px}
.kpi .v{font:500 24px var(--mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);line-height:1.35}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted);display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
